<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B6E6B"/>
      <stop offset="0.55" stop-color="#12A19A"/>
      <stop offset="1" stop-color="#16C7B5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#003B39" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background (iOS masks the corners). -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Network hub-and-spoke topology -->
  <g stroke="#EAFffb" stroke-width="22" stroke-linecap="round" opacity="0.92" filter="url(#soft)">
    <line x1="512" y1="512" x2="512" y2="248"/>
    <line x1="512" y1="512" x2="285" y2="404"/>
    <line x1="512" y1="512" x2="285" y2="646"/>
    <line x1="512" y1="512" x2="739" y2="404"/>
    <line x1="512" y1="512" x2="739" y2="646"/>
    <line x1="512" y1="512" x2="512" y2="776"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#FFFFFF" filter="url(#soft)">
    <circle cx="512" cy="248" r="62"/>
    <circle cx="285" cy="404" r="62"/>
    <circle cx="285" cy="646" r="62"/>
    <circle cx="739" cy="404" r="62"/>
    <circle cx="739" cy="646" r="62"/>
    <circle cx="512" cy="776" r="62"/>
  </g>

  <!-- Central hub -->
  <circle cx="512" cy="512" r="118" fill="#FFFFFF" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="118" fill="none" stroke="#0B6E6B" stroke-width="0" />
  <circle cx="512" cy="512" r="60" fill="#12A19A"/>
</svg>
