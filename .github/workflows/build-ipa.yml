name: Build unsigned IPA

# Builds the NetToolbox.swiftpm app for a real device WITHOUT code signing and
# packages it into an .ipa you can download from the run's Artifacts. An
# unsigned IPA will NOT install by itself — sideload it with Sideloadly or
# AltStore (which re-signs it with your own Apple ID), or use TestFlight/Xcode
# for a properly signed build.
#
# Run it from the GitHub UI: Actions -> "Build unsigned IPA" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Build app (unsigned, device)
        working-directory: NetToolbox.swiftpm
        run: |
          set -o pipefail
          echo "=== xcodebuild -list ==="
          xcodebuild -list 2>&1 || true
          # Auto-detect the app scheme with plain shell (its exact name depends
          # on how Xcode names the .swiftpm app product). Prefer an exact
          # "NetToolbox", then an "App"-ish scheme, then any non-Kit one.
          SCHEMES=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{gsub(/^[ \t]+/,"");print}')
          echo "Schemes found:"; echo "$SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x 'NetToolbox' || true)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i 'app' | head -1 || true)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -v 'Kit' | head -1 || true)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | head -1 || true)
          echo "Chosen scheme: [$SCHEME]"
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine an app scheme to build."
            exit 1
          fi
          # DerivedData MUST live OUTSIDE the app target's source path ("."),
          # else the resolved dependency checkout re-includes this .swiftpm's
          # Assets.xcassets / PrivacyInfo.xcprivacy and collides.
          xcodebuild clean build \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ddp" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/build.log"

      - name: Package into NetToolbox.ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/ddp/Build/Products" -type d -name "NetToolbox.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::NetToolbox.app not found — build produced no app bundle."
            find "$RUNNER_TEMP/ddp/Build/Products" -maxdepth 3 -name "*.app" -type d || true
            exit 1
          fi
          echo "Found app bundle: $APP"
          WORK="$RUNNER_TEMP/pkg"
          rm -rf "$WORK" && mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/"
          ( cd "$WORK" && zip -qry "$GITHUB_WORKSPACE/NetToolbox.ipa" Payload )
          echo "--- IPA ---"
          ls -lh "$GITHUB_WORKSPACE/NetToolbox.ipa"
          unzip -l "$GITHUB_WORKSPACE/NetToolbox.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetToolbox-unsigned-ipa
          path: NetToolbox.ipa
          retention-days: 30
          if-no-files-found: error
